# Render Blueprint. The bot is a long-running worker plus a tiny HTTP health endpoint, so it is deployed
# as a *web service* (free-tier friendly: UptimeRobot can ping /health) backed by a Render PostgreSQL
# database. There is NO local disk state: everything persistent lives in PostgreSQL.
services:
  - type: web
    name: dc-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase: { name: dc-bot-db, property: connectionString }
      - key: DATABASE_SSL
        value: auto
      - { key: DISCORD_TOKEN, sync: false }
      - { key: CLIENT_ID, sync: false }
      - { key: BOT_OWNER_ID, sync: false }
      - { key: MASTER_SERVER_ID, sync: false }
      - { key: GLOBAL_API_KEY, sync: false }
databases:
  - name: dc-bot-db
    plan: free
